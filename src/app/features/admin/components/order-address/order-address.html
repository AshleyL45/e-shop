<div class="address-card">
    <h4>{{ title() }}</h4>
    <address>
        <p><strong>{{ address().name }}</strong></p>
        <p>{{ address().address }}</p>
        <p>{{ address().city }}, {{ address().country }}</p>
        <p>{{ address().zip }}</p>
        <p>{{ address().phone }}</p>
    </address>
</div>
