<article class="order" [attr.aria-expanded]="expanded()" (click)="onToggle()">
    <header class="order-header">
        <div class="left">
            <img [src]="order().items[0].imageUrl" [alt]="order().items[0].name" />
            <h3>{{ order().shipping.name }}</h3>
        </div>

        <div class="right">
            <span class="id">{{ order().id }}</span>
            <time>{{ order().date | date:'dd/MM/yyyy' }}</time>
            <span [ngClass]="getStatusClass(order().status)">
        {{ getStatusLabel(order().status) }}
      </span>
            <strong>{{ order().payment.total | currency:'EUR' }}</strong>
            <i class="pi" [ngClass]="expanded() ? 'pi-chevron-up' : 'pi-chevron-down'"></i>
        </div>
    </header>

    @if (expanded()) {
        <div class="order-body">
            <div class="order-actions">
                <button class="btn-status" (click)="onChangeStatus()">Modifier le statut</button>
            </div>

            <div class="addresses">
                <app-order-address title="Adresse de facturation" [address]="order().billing"></app-order-address>
                <app-order-address title="Adresse de livraison" [address]="order().shipping"></app-order-address>
            </div>

            <app-order-product-list [items]="order().items"></app-order-product-list>
            <app-order-payment [payment]="order().payment"></app-order-payment>
        </div>
    }
</article>
