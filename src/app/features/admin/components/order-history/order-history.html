<section class="orders" aria-labelledby="orders-title">
    <app-order-filters
            (filter)="onFilter($event)"
            (search)="onSearch($event)"
            (sortChange)="sortDirection = $event">
    </app-order-filters>

    @for (order of filteredOrders(sortDirection); track order.id) {
        <app-order-item
                [order]="order"
                [expanded]="expanded() === order.id"
                (toggle)="toggle(order.id)"
                (changeStatus)="openStatusModal($event)">
        </app-order-item>
    }

    @if (!filteredOrders(sortDirection).length) {
        <p class="no-orders" role="status">Aucune commande trouvée pour cette recherche.</p>
    }

    <app-change-status-modal
            [isOpen]="isModalOpen()"
            [order]="selectedOrder()!"
            (close)="closeModal()"
            (saveStatus)="updateOrderStatus($event)">
    </app-change-status-modal>
</section>
